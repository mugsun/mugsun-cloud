# system 服务的配置。分两段：
# 第一段只负责导入——先是 mugsun-boot 的默认配置（从 boot 同步来，不要改），再是微服务版共用的改动；
# 第二段是这个服务自己的配置。同一个配置项，后面的覆盖前面的：
#   boot 默认 < config/application-local.yml < 微服务版共用 < 本文件第二段 < application-<profile>.yml < 环境变量和命令行参数
# 必须分成两段：写在同一段里的话，被导入的文件会反过来覆盖这里的端口和服务名。
spring:
  config:
    import:
      - classpath:mugsun-boot-defaults.yml
      - classpath:mugsun-cloud-defaults.yml
---
server:
  port: 8101
spring:
  application:
    name: mugsun-system
  flyway:
    # 主库的表结构由这个服务迁移；微服务版共用的配置里默认是关的
    enabled: true
mugsun:
  cloud:
    sync:
      # 权限规则和租户数据源都在这个服务里修改，保存时就地生效，不用定时从库里重新加载（说明见 mugsun-cloud-defaults.yml）
      enabled: false
    module:
      # 可选模块拆成了独立的服务，「模块在不在」按注册中心里有没有对应服务的实例判断，结果决定菜单显不显示。
      # 每隔多久向注册中心查一次，两次之间用上次的结果
      presence-cache: 5s
      # 发现实例全部消失后，这段时间内仍然算在：服务重启或滚动发布时菜单不会少一块
      absent-grace: 60s
      gis:
        # GIS 服务在注册中心里的名字。没部署这个服务时，菜单里不显示 GIS，登录信息里 gisEnabled 为 false。
        # 和单体版一样，MUGSUN_GIS_ENABLED=false 或系统参数 gis.module.enabled=false 也会把 GIS 关掉
        service-id: mugsun-gis
      track:
        # 埋点服务在注册中心里的名字。没部署这个服务时，菜单里不显示埋点分析，登录信息里 trackEnabled 为 false。
        # 和单体版一样，MUGSUN_TRACK_ENABLED=false 也会把埋点关掉；埋点没有系统参数开关
        service-id: mugsun-track
