# gis 服务的配置。分两段，写法和理由见 system 服务的 application.yml：
# 第一段只负责导入 mugsun-boot 的默认配置和微服务版共用的改动，第二段是这个服务自己的配置。
# GIS 模块自己的配置（mugsun.gis.*）在 mugsun-module-gis.yml 里，由 boot 的默认配置导入，变量名和单体版相同。
spring:
  config:
    import:
      - classpath:mugsun-boot-defaults.yml
      - classpath:mugsun-cloud-defaults.yml
---
server:
  port: 8102
spring:
  application:
    name: mugsun-gis
