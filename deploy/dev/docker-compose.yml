# 本地开发用的依赖：Nacos（注册中心和配置中心）、PostgreSQL、Redis。
# 用仓库根目录的 ./dev.sh 启动，它会调用同目录的 nacos.sh：首次启动时生成 .env（随机密钥，不进仓库），并算好 gRPC 端口。
# 端口只绑定本机回环地址。Nacos 的客户端接入没有开鉴权，数据库用的是下面写着的默认口令。只给本地开发用，
# 生产环境的要求见 docs/deployment.md。
name: mugsun-cloud-dev

services:
  nacos:
    image: ${MUGSUN_NACOS_IMAGE:-nacos/nacos-server:v3.0.3}
    container_name: mugsun-cloud-nacos
    environment:
      MODE: standalone
      # Nacos 3 启动时必须有这三项，没有默认值
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?先执行 ./nacos.sh up，由它生成 .env}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?先执行 ./nacos.sh up，由它生成 .env}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?先执行 ./nacos.sh up，由它生成 .env}
      # 镜像默认给 1g 堆，本地开发用不到
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      # 客户端先连主端口，再连「主端口 + 1000」的 gRPC 端口，两个宿主机端口必须相差 1000（nacos.sh 会算）
      - "127.0.0.1:${MUGSUN_NACOS_PORT:-8848}:8848"
      - "127.0.0.1:${MUGSUN_NACOS_GRPC_PORT:-9848}:9848"
      # 控制台。容器里是 8080，和网关的默认端口相同，所以宿主机上换一个
      - "127.0.0.1:${MUGSUN_NACOS_CONSOLE_PORT:-8849}:8080"

  postgres:
    # 和单体版本地开发用的是同一个镜像、同一份建库脚本：带 PostGIS 和 pgvector，建好主库 mugsun 和埋点库 mugsun_track
    image: ${MUGSUN_PG_IMAGE:-ghcr.io/mugsun/postgis-pgvector:16-3.4}
    container_name: mugsun-cloud-pg
    # 12 个业务服务都连这一个库，每个服务的连接池最多 10 个连接（track 另有一个埋点库的池），
    # 全部用满是 130 个，超过 PostgreSQL 默认的 100，所以调到 200。平时每个池只留 2 个，远用不到这么多
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MUGSUN_POSTGRES_SUPER_PASSWORD:-postgres}
      # 应用账号 mugsun 的口令。默认值和各服务开发配置里的默认值一样，所以本地开发不用配
      MUGSUN_DB_PASSWORD: ${MUGSUN_DB_PASSWORD:-mugsun}
    ports:
      - "127.0.0.1:${MUGSUN_DB_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 建库脚本从 mugsun-boot 同步，和 Docker 起全套用的是同一份
      - ../docker/boot/init-db.sql:/initdb/init-db.sql:ro
      - ../docker/boot/00-init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
    healthcheck:
      # 走 TCP 检查：首次建库期间只开了本地套接字，那时不算就绪
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mugsun -d mugsun"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7-alpine
    container_name: mugsun-cloud-redis
    ports:
      - "127.0.0.1:${MUGSUN_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pg-data:
