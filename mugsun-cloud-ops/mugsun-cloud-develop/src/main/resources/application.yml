# 代码生成服务的配置。分成几段，写法和理由见 system 服务的 application.yml：
# 第一段只负责导入 mugsun-boot 的默认配置、微服务版共用的改动和 Nacos 配置中心里的两份，第二段是这个服务自己的配置，
# 最后三段是分环境的 Nacos 配置。
spring:
  config:
    import:
      - classpath:mugsun-boot-defaults.yml
      - classpath:mugsun-cloud-defaults.yml
      - optional:nacos:mugsun.yaml
      - optional:nacos:mugsun-develop.yaml
---
server:
  port: 8107
spring:
  application:
    name: mugsun-develop
---
# 分环境的 Nacos 配置：带着对应的 profile 启动时才读，盖过第一段里不分环境的两份。三段的写法一样，只是名字里的环境不同
spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:nacos:mugsun-dev.yaml
      - optional:nacos:mugsun-develop-dev.yaml
---
spring:
  config:
    activate:
      on-profile: test
    import:
      - optional:nacos:mugsun-test.yaml
      - optional:nacos:mugsun-develop-test.yaml
---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:nacos:mugsun-prod.yaml
      - optional:nacos:mugsun-develop-prod.yaml
