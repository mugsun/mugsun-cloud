# mugsun-cloud 网关。对外只开网关这一个端口（默认 8080，和单体版 mugsun-boot 一样），接口路径和单体版一致。

server:
  port: 8080
  shutdown: graceful
  # 必须是 none，改成别的值网关拒绝启动。native / framework 会不分来源地采信请求里的 X-Forwarded-*，
  # 客户端可以冒充别的地址；不写的话，在 Kubernetes 等平台上默认就是 native。
  # 网关前面有反向代理时，用最下面的 mugsun.gateway.trusted-proxies 写明代理地址
  forward-headers-strategy: none
  netty:
    # 请求行（地址加查询串）的长度上限。默认 4KB，后端 Tomcat 是 8KB；不调大的话，单体版能收的长查询串在网关会被拒
    max-initial-line-length: 8KB

spring:
  application:
    name: mugsun-gateway
  config:
    # 配置中心：启动时到 Nacos 读这两份配置，里面的配置项盖过这个文件里的同名项。
    # 命令行参数、名字和配置项对得上的环境变量仍然比 Nacos 优先，变量是空的也算：下面 mugsun.gateway 的开关都是这一类，
    # 变量传进了进程（哪怕没有值），Nacos 里的同一项就不起作用。只在这个文件里用占位符引用、名字对不上的变量
    # （如 MUGSUN_OPENAPI_TRUSTED_PROXIES）会被 Nacos 里的同一项盖过。
    # mugsun.yaml 是网关和所有服务共用的，mugsun-gateway.yaml 只给网关；两份都可以不建。
    # 带着 dev、test、prod 启动时还会读分环境的两份，写在这个文件最后的三段里。
    # 谁盖过谁、哪些改了马上生效、哪些要重启，见 docs/deployment.md「配置中心」
    import:
      - optional:nacos:mugsun.yaml
      - optional:nacos:mugsun-gateway.yaml
  cloud:
    nacos:
      config:
        # 写 false 关掉配置中心：不到 Nacos 读配置，只用这个文件和环境变量。留空等于没配，按默认值（开）
        enabled: ${MUGSUN_CONFIG_CENTER:true}
        # 保持 remote：Nacos 里的配置排在 application-<profile>.yml 这类分环境的文件前面。
        # 去掉以后，那些文件里写了的项，Nacos 的值盖不住
        preference: remote
        # 地址、账号、命名空间和分组，与服务注册用的是同一套
        server-addr: ${MUGSUN_NACOS_ADDR:127.0.0.1:8848}
        username: ${MUGSUN_NACOS_USERNAME:}
        password: ${MUGSUN_NACOS_PASSWORD:}
        namespace: ${MUGSUN_NACOS_NAMESPACE:}
        group: ${MUGSUN_NACOS_GROUP:DEFAULT_GROUP}
      discovery:
        server-addr: ${MUGSUN_NACOS_ADDR:127.0.0.1:8848}
        username: ${MUGSUN_NACOS_USERNAME:}
        password: ${MUGSUN_NACOS_PASSWORD:}
        namespace: ${MUGSUN_NACOS_NAMESPACE:}
        group: ${MUGSUN_NACOS_GROUP:DEFAULT_GROUP}
        # 注册到注册中心的本机地址；留空自动取第一块非回环网卡，多网卡或开着 VPN 时建议写明
        ip: ${MUGSUN_SERVICE_IP:}
        metadata:
          # 告诉监控中心网关的健康检查在哪：它默认到 /actuator 下面找，网关的在 /_gateway 下面（见下面的 management）
          "[management.context-path]": /_gateway
    loadbalancer:
      cache:
        # 服务实例列表的缓存时间。默认 35 秒，服务重启后要等这么久才切到新实例，调短
        ttl: 5s
    gateway:
      server:
        webflux:
          # X-Forwarded-* 只由 ClientAddressFilter 写。下面两项保持 false：自带的处理不启用，客户端带来的转发头在转发前全部删掉。
          # 不要设置 spring.cloud.gateway.server.webflux.trusted-proxies，可信代理写在最下面的 mugsun.gateway.trusted-proxies
          x-forwarded:
            enabled: false
          forwarded:
            enabled: false
          httpclient:
            # 连后端服务的超时（毫秒）。不设响应超时：导出、流式输出这类长请求和单体版一样不被中途切断
            connect-timeout: 3000
            pool:
              # 要小于后端 Tomcat 保持空闲连接的时间（默认 60 秒），否则会取到已经被后端关掉的连接
              max-idle-time: 30s
          # 跨域只由网关应答：预检请求到不了后面的服务，服务自己写的跨域响应头也会被网关去掉（DownstreamCorsHeadersFilter）。
          # 规则和 mugsun-boot 的 CorsConfig 一致：任意来源、不带 Cookie；boot 改了跨域规则时这里要跟着改
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "*"
                allowed-headers: "*"
                allowed-methods: "*"
                allow-credentials: false
                max-age: 3600
          # 路由按顺序匹配，范围小的写在前面，最后一条兜底。拆出新服务时在 mugsun-system 前面加一条。
          # 路径和各模块控制器的前缀一致（mugsun-boot 的 ModuleGateConfig 里有同一份清单），GatewayRoutesTest 验证这张表
          routes:
            - id: mugsun-gis
              uri: lb://mugsun-gis
              predicates:
                - Path=/system/gis/**
            # /track/** 是埋点 SDK 上报用的公开接口，/system/track/** 是管理后台的接口
            - id: mugsun-track
              uri: lb://mugsun-track
              predicates:
                - Path=/track/**,/system/track/**
            # /system/ai/** 是管理后台的接口，/v1/** 是 OpenAI 兼容的开放接口（调用方用 AI 密钥，不用登录）
            - id: mugsun-ai
              uri: lb://mugsun-ai
              predicates:
                - Path=/system/ai/**,/v1/**
            # 日志服务：六类日志的查询和处理接口。这些路径和别的 /system/** 一样，本来归兜底的 mugsun-system，
            # 所以要一个一个写在它前面。日志服务多了、少了接口类时这里要跟着改，漏了的话请求落到 system 上，得到 404；
            # 两边对不对得上，由日志服务的 LogRoutesTest 检查
            - id: mugsun-log
              uri: lb://mugsun-log
              predicates:
                - Path=/system/oper-log/**,/system/login-log/**,/system/usual-log/**,/system/data-audit/**,/system/api-log/**,/system/error-log/**
            # 报表服务：报表的定义和预览接口。和上面的日志服务一样，路径要写在 mugsun-system 前面；
            # 两边对不对得上，由报表服务的 ReportRoutesTest 检查
            - id: mugsun-report
              uri: lb://mugsun-report
              predicates:
                - Path=/system/report/**
            # 代码生成服务：代码生成、数据建模、代码生成用的数据源和方案、在线表单。路径要写在 mugsun-system 前面；
            # 两边对不对得上，由代码生成服务的 DevelopRoutesTest 检查
            - id: mugsun-develop
              uri: lb://mugsun-develop
              predicates:
                - Path=/system/gen/**,/system/gen-datasource/**,/system/gen-scheme/**,/system/online-form/**
            # 定时任务服务：定时任务和调度中心两个页面的接口。路径要写在 mugsun-system 前面；
            # 两边对不对得上，由定时任务服务的 JobRoutesTest 检查
            - id: mugsun-job
              uri: lb://mugsun-job
              predicates:
                - Path=/system/job/**,/system/job-server/**
            # 文件和短信服务：文件上传下载、存储配置、短信配置、富文本图片、头像、反馈附件，路径要写在 mugsun-system 前面；
            # /file/** 是本地存储直出的文件地址，不是接口类，文件在这个服务的存储目录里，所以也转给它。
            # 两边对不对得上，由文件和短信服务的 ResourceRoutesTest 检查
            - id: mugsun-resource
              uri: lb://mugsun-resource
              predicates:
                - Path=/system/file/**,/system/oss/**,/system/sms/**,/system/richtext/image/**,/auth/avatar/**,/system/feedback/attachment/**,/file/**
            # 审批流服务：流程设计、发起、待办、办理（/system/flow）和手机端的待办（/app/todos），路径要写在 mugsun-system 前面；
            # 手机端别的接口（/app 下其它路径）还在 system。两边对不对得上，由审批流服务的 FlowRoutesTest 检查
            - id: mugsun-flow
              uri: lb://mugsun-flow
              predicates:
                - Path=/system/flow/**,/app/todos/**
            # 工作台服务：通知公告（/system/notice）、登录后首页的工作台（/system/workbench）和手机端消息中心里的公告（/app/inbox/notices），
            # 路径要写在 mugsun-system 前面；手机端的站内信（/app/inbox 下其它路径）还在 system。两边对不对得上，由工作台服务的 DeskRoutesTest 检查
            - id: mugsun-desk
              uri: lb://mugsun-desk
              predicates:
                - Path=/system/notice/**,/system/workbench/**,/app/inbox/notices/**
            # 登录服务：登录和验证码（/auth）、在线用户、开放授权（/oauth2、/open、OAuth 应用和调用记录）、手机端的登录和验证码，
            # 路径要写在 mugsun-system 前面；/auth/avatar 归文件和短信服务，所以还要写在 mugsun-resource 后面。
            # 两边对不对得上，由登录服务的 AuthRoutesTest 检查
            - id: mugsun-auth
              uri: lb://mugsun-auth
              predicates:
                - Path=/auth/**,/auth/captcha/**,/system/online/**,/oauth2/**,/system/oauth-client/**,/system/oauth-log/**,/open/**,/app/auth/**,/app/captcha/**
            - id: mugsun-system
              uri: lb://mugsun-system
              predicates:
                - Path=/**

management:
  endpoints:
    web:
      # 网关自己的健康检查在 /_gateway/health。/actuator 让给后面的服务：前端监控页用的是后端的 /actuator
      base-path: /_gateway
      exposure:
        include: health
  health:
    refresh:
      # 关掉「配置刷新出过错」这一项健康检查。开着的话，Nacos 里一个值写错了（类型不对，或者被程序拒绝），
      # 读到它的实例会同时变成不健康，前面的负载均衡跟着把它们全部摘掉；其实各实例都还照原来的配置正常运行。
      # 写错的值在日志里有 ERROR
      enabled: false

mugsun:
  gateway:
    # 这一层的配置项不要分组（不要再往下嵌套），MUGSUN_GATEWAY_ 开头的环境变量名就是配置项名换成大写加下划线。
    # 分了组以后，和组同名的环境变量留空时网关启动不了，原因写在 GatewayGuardProperties 的说明里。
    # 变量留空等于没配，按默认值。
    # 网关前面的可信代理（Nginx、负载均衡）的地址段，逗号分隔，如 172.30.88.10/32。
    # 只有请求直接来自这些地址时，才采信它带来的 X-Forwarded-For / -Proto / -Host / -Port；留空表示网关直接面向客户端。
    # 变量名沿用单体版：原来配给后端的值，现在配给网关。
    trusted-proxies: ${MUGSUN_OPENAPI_TRUSTED_PROXIES:}
    # 服务之间互相调用的内部接口的路径前缀，网关不对外转发
    inner-path: /inner
    # 按客户端地址限制转发。地址段是逗号分隔的 CIDR；下面四项都留空（默认）就没有任何限制，写错了网关拒绝启动。
    # 网关前面有反向代理时要先配好上面的 trusted-proxies，否则所有请求的地址都是代理的地址。
    # 黑名单：这些地址发来的请求不转发，返回 403
    deny-ips: ${MUGSUN_GATEWAY_DENY_IPS:}
    # 白名单：不为空时，只转发这些地址发来的请求
    allow-ips: ${MUGSUN_GATEWAY_ALLOW_IPS:}
    # 不对外开放的路径前缀，逗号分隔，如 /actuator,/v3/api-docs,/swagger-ui。只有 restricted-allow-ips 里的地址能访问，
    # 后者留空就是谁都不能经网关访问
    restricted-paths: ${MUGSUN_GATEWAY_RESTRICTED_PATHS:}
    restricted-allow-ips: ${MUGSUN_GATEWAY_RESTRICTED_ALLOW_IPS:}
    # 限流：按客户端地址数请求，超过限额的不转发，返回 429。下面三项都留空（默认）就不限流，写错了网关拒绝启动。
    # 计数在每个网关实例自己的内存里：起了 N 个网关时，一个地址实际能过的请求最多是限额的 N 倍。
    # 网关前面有反向代理时要先配好上面的 trusted-proxies，否则所有请求都算在代理的地址上。详见 docs/deployment.md「限流」
    # 默认限额，写成 次数/时长，时长是数字加 s、m、h，如 600/60s。没有单独定限额的路径都用它；留空表示这些路径不限流
    rate-limit: ${MUGSUN_GATEWAY_RATE_LIMIT:}
    # 给个别路径单独定限额，逗号分隔，每条写成 路径前缀=次数/时长，右边写 unlimited 表示这个前缀下不限流，
    # 如 /auth/login=30/60s,/track=unlimited。一个请求只算一条：前缀最长的那条，都不沾的用默认限额
    rate-limit-paths: ${MUGSUN_GATEWAY_RATE_LIMIT_PATHS:}
    # 不限流的客户端地址段，逗号分隔的 CIDR，如办公网的出口、监控系统
    rate-limit-exempt-ips: ${MUGSUN_GATEWAY_RATE_LIMIT_EXEMPT_IPS:}
    # 访问日志：每个请求结束时记一行（日志名 ACCESS），写明客户端地址、路径（不带查询串）、状态码、耗时、
    # 转给了哪个服务的哪个实例、请求编号。各字段的含义见 docs/deployment.md「网关的访问日志」
    # all 每个请求都记；problems 只记有问题的（5xx、转发出错、慢请求，这些按警告级别记）；none 不记
    access-log: ${MUGSUN_GATEWAY_ACCESS_LOG:all}
    # 从收到请求到开始回应超过这么多毫秒算慢请求；0 表示不按耗时区分
    slow-millis: ${MUGSUN_GATEWAY_SLOW_MILLIS:3000}
    # 动态路由：从 Nacos 的一份配置里读路由，改了马上生效，不用重启网关。默认不启用（写 true 启用）。
    # 能写什么、不能写什么、写错了会怎样，见 docs/deployment.md「改路由不用重启网关」
    dynamic-routes: ${MUGSUN_GATEWAY_DYNAMIC_ROUTES:false}
    # 放路由的那份配置的 Data ID 和分组；分组留空表示和服务注册用同一个（MUGSUN_NACOS_GROUP）
    dynamic-routes-data-id: mugsun-gateway-routes.yaml
    dynamic-routes-group:
    # 灰度规则：从 Nacos 的一份配置里读「哪些请求走灰度」（按客户端地址、按域名、按比例），改了马上生效，不用重启网关。
    # 默认不启用（写 true 启用）：没有任何请求走灰度。不管启不启用，带着灰度标记（MUGSUN_LANE）启动的实例都收不到没有标记的请求。
    # 规则怎么写、写错了会怎样、一次灰度发布怎么做，见 docs/deployment.md「灰度发布」
    lanes: ${MUGSUN_GATEWAY_LANES:false}
    # 放灰度规则的那份配置的 Data ID 和分组；分组留空表示和服务注册用同一个（MUGSUN_NACOS_GROUP）
    lanes-data-id: mugsun-gateway-lanes.yaml
    lanes-group:

---
# 分环境的 Nacos 配置：带着对应的 profile 启动时才读，盖过上面不分环境的两份。三段的写法一样，只是名字里的环境不同
spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:nacos:mugsun-dev.yaml
      - optional:nacos:mugsun-gateway-dev.yaml
---
spring:
  config:
    activate:
      on-profile: test
    import:
      - optional:nacos:mugsun-test.yaml
      - optional:nacos:mugsun-gateway-test.yaml
---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:nacos:mugsun-prod.yaml
      - optional:nacos:mugsun-gateway-prod.yaml
