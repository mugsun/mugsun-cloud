# mugsun-cloud 网关。对外只开网关这一个端口（默认 8080，和单体版 mugsun-boot 一样），接口路径和单体版一致。

server:
  port: 8080
  shutdown: graceful
  # 必须是 none，改成别的值网关拒绝启动。native / framework 会不分来源地采信请求里的 X-Forwarded-*，
  # 客户端可以冒充别的地址；不写的话，在 Kubernetes 等平台上默认就是 native。
  # 网关前面有反向代理时，用最下面的 mugsun.gateway.trusted-proxies 写明代理地址
  forward-headers-strategy: none
  netty:
    # 请求行（地址加查询串）的长度上限。默认 4KB，后端 Tomcat 是 8KB；不调大的话，单体版能收的长查询串在网关会被拒
    max-initial-line-length: 8KB

spring:
  application:
    name: mugsun-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${MUGSUN_NACOS_ADDR:127.0.0.1:8848}
        username: ${MUGSUN_NACOS_USERNAME:}
        password: ${MUGSUN_NACOS_PASSWORD:}
        namespace: ${MUGSUN_NACOS_NAMESPACE:}
        group: ${MUGSUN_NACOS_GROUP:DEFAULT_GROUP}
        # 注册到注册中心的本机地址；留空自动取第一块非回环网卡，多网卡或开着 VPN 时建议写明
        ip: ${MUGSUN_SERVICE_IP:}
    loadbalancer:
      cache:
        # 服务实例列表的缓存时间。默认 35 秒，服务重启后要等这么久才切到新实例，调短
        ttl: 5s
    gateway:
      server:
        webflux:
          # X-Forwarded-* 只由 ClientAddressFilter 写。下面两项保持 false：自带的处理不启用，客户端带来的转发头在转发前全部删掉。
          # 不要设置 spring.cloud.gateway.server.webflux.trusted-proxies，可信代理写在最下面的 mugsun.gateway.trusted-proxies
          x-forwarded:
            enabled: false
          forwarded:
            enabled: false
          httpclient:
            # 连后端服务的超时（毫秒）。不设响应超时：导出、流式输出这类长请求和单体版一样不被中途切断
            connect-timeout: 3000
            pool:
              # 要小于后端 Tomcat 保持空闲连接的时间（默认 60 秒），否则会取到已经被后端关掉的连接
              max-idle-time: 30s
          # 跨域只由网关应答：预检请求到不了后面的服务，服务自己写的跨域响应头也会被网关去掉（DownstreamCorsHeadersFilter）。
          # 规则和 mugsun-boot 的 CorsConfig 一致：任意来源、不带 Cookie；boot 改了跨域规则时这里要跟着改
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "*"
                allowed-headers: "*"
                allowed-methods: "*"
                allow-credentials: false
                max-age: 3600
          # 路由按顺序匹配，范围小的写在前面，最后一条兜底。拆出新服务时在 mugsun-system 前面加一条。
          # 路径和各模块控制器的前缀一致（mugsun-boot 的 ModuleGateConfig 里有同一份清单），GatewayRoutesTest 验证这张表
          routes:
            - id: mugsun-gis
              uri: lb://mugsun-gis
              predicates:
                - Path=/system/gis/**
            # /track/** 是埋点 SDK 上报用的公开接口，/system/track/** 是管理后台的接口
            - id: mugsun-track
              uri: lb://mugsun-track
              predicates:
                - Path=/track/**,/system/track/**
            # /system/ai/** 是管理后台的接口，/v1/** 是 OpenAI 兼容的开放接口（调用方用 AI 密钥，不用登录）
            - id: mugsun-ai
              uri: lb://mugsun-ai
              predicates:
                - Path=/system/ai/**,/v1/**
            - id: mugsun-system
              uri: lb://mugsun-system
              predicates:
                - Path=/**

management:
  endpoints:
    web:
      # 网关自己的健康检查在 /_gateway/health。/actuator 让给后面的服务：前端监控页用的是后端的 /actuator
      base-path: /_gateway
      exposure:
        include: health

mugsun:
  gateway:
    # 网关前面的可信代理（Nginx、负载均衡）的地址段，逗号分隔，如 172.30.88.10/32。
    # 只有请求直接来自这些地址时，才采信它带来的 X-Forwarded-For / -Proto / -Host / -Port；留空表示网关直接面向客户端。
    # 变量名沿用单体版：原来配给后端的值，现在配给网关。
    trusted-proxies: ${MUGSUN_OPENAPI_TRUSTED_PROXIES:}
    # 服务之间互相调用的内部接口的路径前缀，网关不对外转发
    inner-path: /inner
    # 按客户端地址限制转发。地址段是逗号分隔的 CIDR；下面四项都留空（默认）就没有任何限制，写错了网关拒绝启动。
    # 网关前面有反向代理时要先配好上面的 trusted-proxies，否则所有请求的地址都是代理的地址。
    # 黑名单：这些地址发来的请求不转发，返回 403
    deny-ips: ${MUGSUN_GATEWAY_DENY_IPS:}
    # 白名单：不为空时，只转发这些地址发来的请求
    allow-ips: ${MUGSUN_GATEWAY_ALLOW_IPS:}
    # 不对外开放的路径前缀，逗号分隔，如 /actuator,/v3/api-docs,/swagger-ui。只有 restricted-allow-ips 里的地址能访问，
    # 后者留空就是谁都不能经网关访问
    restricted-paths: ${MUGSUN_GATEWAY_RESTRICTED_PATHS:}
    restricted-allow-ips: ${MUGSUN_GATEWAY_RESTRICTED_ALLOW_IPS:}
    # 限流：按客户端地址数请求，超过限额的不转发，返回 429。下面三项都留空（默认）就不限流，写错了网关拒绝启动。
    # 计数在每个网关实例自己的内存里：起了 N 个网关时，一个地址实际能过的请求最多是限额的 N 倍。
    # 网关前面有反向代理时要先配好上面的 trusted-proxies，否则所有请求都算在代理的地址上。详见 docs/deployment.md「限流」
    rate-limit:
      # 默认限额，写成 次数/时长，时长是数字加 s、m、h，如 600/60s。没有单独定限额的路径都用它；留空表示这些路径不限流
      limit: ${MUGSUN_GATEWAY_RATE_LIMIT:}
      # 给个别路径单独定限额，逗号分隔，每条写成 路径前缀=次数/时长，右边写 unlimited 表示这个前缀下不限流，
      # 如 /auth/login=30/60s,/track=unlimited。一个请求只算一条：前缀最长的那条，都不沾的用默认限额
      path-limits: ${MUGSUN_GATEWAY_RATE_LIMIT_PATHS:}
      # 不限流的客户端地址段，逗号分隔的 CIDR，如办公网的出口、监控系统
      exempt-ips: ${MUGSUN_GATEWAY_RATE_LIMIT_EXEMPT_IPS:}
    # 访问日志：每个请求结束时记一行（日志名 ACCESS），写明客户端地址、路径（不带查询串）、状态码、耗时、
    # 转给了哪个服务的哪个实例、请求编号。各字段的含义见 docs/deployment.md「网关的访问日志」
    access-log:
      # all 每个请求都记；problems 只记有问题的（5xx、转发出错、慢请求，这些按警告级别记）；none 不记
      mode: ${MUGSUN_GATEWAY_ACCESS_LOG:all}
      # 从收到请求到开始回应超过这么多毫秒算慢请求；0 表示不按耗时区分
      slow-millis: ${MUGSUN_GATEWAY_SLOW_MILLIS:3000}
    # 动态路由：从 Nacos 的一份配置里读路由，改了马上生效，不用重启网关。默认不启用（写 true 启用）。
    # 能写什么、不能写什么、写错了会怎样，见 docs/deployment.md「改路由不用重启网关」
    dynamic-routes:
      enabled: ${MUGSUN_GATEWAY_DYNAMIC_ROUTES:false}
      # 放路由的那份配置的 Data ID 和分组；分组留空表示和服务注册用同一个（MUGSUN_NACOS_GROUP）
      data-id: mugsun-gateway-routes.yaml
      group:
