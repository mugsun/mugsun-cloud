# 微服务版在 mugsun-boot 默认配置（mugsun-boot-defaults.yml）之上的改动，各业务服务共用。
# 只放「因为拆成了多个服务、前面多了网关」才需要的配置；业务配置一律沿用 boot 的，不在这里重写。

server:
  # 请求都经网关转发过来，直接连上来的地址是网关。让容器采信网关写的 X-Forwarded-*：
  # getRemoteAddr() 得到真实的客户端地址（登录锁定、限流、各类日志都用它），isSecure() 跟客户端用的协议一致。
  # 只采信从内网地址连上来的请求带的头（Tomcat 默认规则：10/8、172.16/12、192.168/16、127/8 等）。
  # 网关和服务之间走的不是内网地址时，用 server.tomcat.remoteip.internal-proxies 写明网关地址（正则）。
  # 服务端口不要对外暴露：绕过网关直接访问服务的人可以自己填这几个头。
  forward-headers-strategy: native

spring:
  flyway:
    # 主库的表结构只由 system 服务迁移：迁移脚本只在它的包里，它在自己的 application.yml 里重新打开。
    # 其它服务不执行迁移，所以要先启动 system（升级时也是先升 system），再启动其它服务。
    enabled: false
  cloud:
    nacos:
      discovery:
        server-addr: ${MUGSUN_NACOS_ADDR:127.0.0.1:8848}
        username: ${MUGSUN_NACOS_USERNAME:}
        password: ${MUGSUN_NACOS_PASSWORD:}
        namespace: ${MUGSUN_NACOS_NAMESPACE:}
        group: ${MUGSUN_NACOS_GROUP:DEFAULT_GROUP}
        # 注册到注册中心的本机地址；留空自动取第一块非回环网卡，多网卡或开着 VPN 时建议写明
        ip: ${MUGSUN_SERVICE_IP:}
        # 保持 0。停止时「注销后等一会儿再停」由下面的 mugsun.cloud.shutdown.deregister-wait 负责，
        # 框架自带的这一项不是 0 的话会再等一遍
        graceful-shutdown-wait-time: 0

mugsun:
  cloud:
    inner:
      # 服务之间互相调用（/inner 开头的接口）用的共享密钥，各业务服务必须配成同一个，至少 32 个字符。
      # 没有默认值，可以用 openssl rand -hex 32 生成。不配时内部调用整体停用：服务不接受 /inner 请求，也不发起调用，
      # 跨服务的功能（AI 读图层和埋点数据、埋点问答和代码生成用大模型）按「对方没有部署」处理。配了但不够长时拒绝启动。
      # 这把密钥只证明「请求来自自己的服务」，请求内容并不加密；服务端口仍然不要对外暴露。
      secret: ${MUGSUN_INNER_SECRET:}
      # 调用方和被调用方的机器时间最多差多少，超过就拒绝（最大 10 分钟）。各机器要开时间同步
      clock-skew: 60s
      # 连接超时；连不上一个实例时会换另一个实例再试一次
      connect-timeout: 2s
      # 等对方返回的时间上限
      read-timeout: 10s
      # 对方要去调大模型的那几个接口，等返回的时间上限
      long-read-timeout: 120s
      # 请求体、响应体的大小上限
      max-request-size: 1MB
      max-response-size: 8MB
    sync:
      # 数据权限规则、接口权限规则和角色授权、租户独立数据源，这三样以库里的为准，每个服务进程又在内存里留了一份。
      # 租户和套餐也在每个进程里缓存着，60 秒过期。
      # 修改它们的管理接口只在 system 服务里，保存时只刷新得了处理那次请求的那一个 system 实例，
      # 所以每个服务的每个实例（包括 system）都跑一个同步任务：
      # - 保存以后，那个实例给 Redis 里的版本换一个新值；每个实例隔 check-interval-ms 读一次，变了就从库里重新加载前三样，
      #   把缓存的租户和套餐清掉，下一次用到时再查库
      # - 版本没变，离上次加载满 interval-ms 也这样做一次。Redis 不可用时靠这一条
      enabled: true
      # 多久读一次 Redis 里的版本（毫秒）。改完以后，最长过这么久在所有实例上开始生效
      check-interval-ms: 1000
      # 兜底的重新加载间隔（毫秒）
      interval-ms: 30000
    shutdown:
      # 停止时先从注册中心注销，再照常处理请求这么久，然后才开始停。网关把实例列表缓存 5 秒，
      # 注销后马上停的话，这几秒里转过来的请求会失败。
      # 要比网关的缓存时间（网关的 spring.cloud.loadbalancer.cache.ttl）长两三秒；配成 0 就是注销后马上停。
      # 每次停止会多花这么久，容器的停止宽限时间要留够：这段等待，加上等手上的请求做完（最长 20 秒）
      deregister-wait: 8s
    machine-number:
      # 程序生成主键时会把一个「机器号」拼进去，两个进程的机器号不同，同一毫秒里生成的主键才不会相同。
      # 每个服务的每个实例启动时到 Redis 领一个别的实例没在用的号，停止时还回去。号是 2 到 99，所有服务合用，
      # 所以同时在线的实例（四个服务加起来）最多 98 个。
      # 领不到（Redis 不可用，或者号都占着）不影响启动：先用 1，日志里有 WARN，以后每次续期的时候再试着领。
      # 关掉以后所有实例都用 1：几个进程同一毫秒往同一张表里写时，主键有可能相同，后写的那一条会失败
      enabled: true
      # 领到的号在 Redis 里登记多久过期。实例每隔这个时间的六分之一续期一次；被强行杀掉、来不及归还的实例，
      # 它的号要过这么久才空出来。不能小于 10 秒
      ttl: 3m
  websocket:
    # 推送固定走 Redis。WebSocket 连接都在 system 上，其它服务要推送时（比如 track 发告警站内信）把消息发到 Redis，
    # 由 system 投递给在线用户。boot 的默认值就是 redis，这里再写一遍是防止 config/application-local.yml 把它改成 local：
    # local 只认本进程里的连接，system 以外的服务没有连接可发，启动时就会因为找不到发送器而失败
    sender-type: redis

logging:
  file:
    # 日志文件按服务名分开（./logs/mugsun-system.log 等）。boot 的默认文件名是固定的 mugsun-boot，
    # 几个服务在同一个目录下启动会写进同一个文件
    name: ${spring.application.name}
  pattern:
    # 每行日志在级别后面带上请求编号（网关定的 X-Trace-Id），控制台和日志文件都带：拿着编号能把一次请求在网关和
    # 各服务的日志里对上。不在请求里打的日志（启动、定时任务）这一格是空的 []。
    # boot 的 logback-spring.xml 里也设了同样的格式，但写在引入 Spring Boot 默认格式之后，那时整行的格式已经定下，
    # 不起作用；这一项在日志配置文件被读入之前就交给日志系统，所以生效
    level: "%5p [%X{traceId}]"

---
# 本地开发（--spring.profiles.active=dev）时不一样的地方
spring:
  config:
    activate:
      on-profile: dev
mugsun:
  cloud:
    shutdown:
      # 本地开发不等：停服务、重启服务不用每次多等这几秒
      deregister-wait: 0s
